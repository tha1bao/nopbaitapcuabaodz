<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h2>Kiểm tra số cùng dấu</h2>
    <input type="number" id="a" placeholder="Nhập a"><br>
    <input type="number" id="b" placeholder="Nhập b"><br>
    <button onclick="hienThiKetQua()">Kiểm tra</button>
    <p id="result"></p>
    <script>


        function checkSign(a, b) {
            if (a == 0 && b == 0) return "Cả hai số đều bằng 0";
            if ((a > 0 && b > 0) || (a < 0 && b < 0)) return "Hai số cùng dấu";
            return "Hai số khác dấu";


        }
        function hienThiKetQua() {
            var a = parseInt(document.getElementById("a").value);
            var b = parseInt(document.getElementById("b").value);
            if (isNaN(a) || isNaN(b)) {
                document.getElementById("result").innerText = "Vui lòng nhập cả hai số";
                return;
            }
            document.getElementById("result").innerText = checkSign(a, b);
        }

    </script>
</body>

</html>
