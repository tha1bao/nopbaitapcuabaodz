<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h2>Tính giá trị biểu thức:</h2>
    <h3>Cho trước số nguyên n. Tính giá trị biểu thức sau <br> S= 1*2 + 2*3 + 3*4 + ... +
        n*(n+1)</h3>
    <input type="number" id="n" placeholder="Nhập n"><br>
    <button onclick="hienThiKetQua()">Tính</button>
    <p id="result"></p>
    <script>
        function tinhGiaTriBieuThuc(n) {
            return sum = n * (n + 1) * (n + 2) / 3;
        }
        function hienThiKetQua() {
            var n = parseInt(document.getElementById("n").value);
            if (isNaN(n)) {
                document.getElementById("result").innerText = "Vui lòng nhập số nguyên";
                return;
            }
            var ketQua = tinhGiaTriBieuThuc(n);
            document.getElementById("result").innerText = "Giá trị biểu thức là: " + ketQua;
        }
    </script>
</body>

</html>
