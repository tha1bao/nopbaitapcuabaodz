<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h2>Kiểm tra số nguyên tố</h2>
    <input type="number" id="n" placeholder="Nhập n"><br>
    <button onclick="hienThiKetQua()">Kiểm tra</button>
    <p id="result"></p>
    <script>
        function isPrime(n) {
            if (n <= 1) return false;
            for (let i = 2; i <= Math.sqrt(n); i++) {
                if (n % i == 0) return false;
            }
            return true;
        }
        function hienThiKetQua() {
            var n = parseInt(document.getElementById("n").value);
            if (isNaN(n)) {
                document.getElementById("result").innerText = "Vui lòng nhập số nguyên";
                return;
            }
            var ketQua = isPrime(n);
            document.getElementById("result").innerText = ketQua ? n + " là số nguyên tố" : n + " không phải số nguyên tố";
        }
    </script>
</body>

</html>
